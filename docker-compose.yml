services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: mkv-rename-aspire-dashboard
    ports:
      - "18888:18888"
      - "4317:18889"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    restart: unless-stopped

  dev:
    build:
      context: .
      target: development
    image: ghcr.io/nickspaghetti/mkv-rename-wizard/mkv-rename-wizard:local-dev
    container_name: mkv-rename-dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
      - cargo-cache:/usr/local/cargo/registry
    tmpfs:
      - /sandbox:rw,size=256m
    environment:
      TERM: xterm-256color
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: mkv-rename-cli
    depends_on:
      - aspire-dashboard

volumes:
  nuget-cache:
  cargo-cache:
