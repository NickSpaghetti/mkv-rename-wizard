name: Release (Native AOT)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.check.outputs.semver }}
    steps:
      - name: Validate SemVer tag format
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' must match SemVer tag format (e.g. v1.0.0 or v1.0.0-rc.1)"
            exit 1
          fi
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: macos-latest
            rid: osx-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT (${{ matrix.rid }})
        run: >
          dotnet publish MkvRenameWizard/MkvRenameWizard/MkvRenameWizard.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:StripSymbols=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ needs.validate.outputs.semver }}
          -o publish/${{ matrix.rid }}

      - name: Remove debug symbols from publish output
        shell: bash
        run: rm -f publish/${{ matrix.rid }}/*.dbg publish/${{ matrix.rid }}/*.pdb

      - name: Package macOS .app bundle (tar.gz)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SEMVER: ${{ needs.validate.outputs.semver }}
          VERSION_TAG: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          APP_DIR="stage/MkvRenameWizard.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" dist
          cp -R "publish/${RID}/." "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/MkvRenameWizard"
          cp Packaging/Icons/mkv-rename-wizard.icns "$APP_DIR/Contents/Resources/mkv-rename-wizard.icns"
          sed "s/__VERSION__/${SEMVER}/g" Packaging/macos/Info.plist > "$APP_DIR/Contents/Info.plist"
          tar -czf "dist/MkvRenameWizard-${VERSION_TAG}-${RID}.tar.gz" -C stage MkvRenameWizard.app

      - name: Package Linux archive (tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          STAGE_DIR="stage/linux"
          mkdir -p "$STAGE_DIR" dist
          cp -R "publish/${RID}/." "$STAGE_DIR/"
          chmod +x "$STAGE_DIR/MkvRenameWizard"
          cp Packaging/linux/mkv-rename-wizard.desktop "$STAGE_DIR/mkv-rename-wizard.desktop"
          for size in 16 22 24 32 48 64 128 256 512 1024; do
            ICON_DIR="$STAGE_DIR/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$ICON_DIR"
            cp "Packaging/Icons/linux/icon-${size}.png" "$ICON_DIR/mkv-rename-wizard.png"
          done
          tar -czf "dist/MkvRenameWizard-${VERSION_TAG}-${RID}.tar.gz" -C "$STAGE_DIR" .

      - name: Package Windows archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/MkvRenameWizard-${{ inputs.version }}-${{ matrix.rid }}.zip"

      - name: Upload build artifact (7-day max retention)
        uses: actions/upload-artifact@v7
        with:
          name: MkvRenameWizard-${{ matrix.rid }}
          path: dist/MkvRenameWizard-${{ inputs.version }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum MkvRenameWizard-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: MkvRenameWizard ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/MkvRenameWizard-*
            dist/SHA256SUMS.txt
